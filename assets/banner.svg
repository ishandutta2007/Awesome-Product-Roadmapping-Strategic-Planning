<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="lane1Grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><linearGradient id="lane2Grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#d946ef"/></linearGradient><linearGradient id="lane3Grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.05)}}@keyframes slideBar1{0%{transform:translateX(0)}50%{transform:translateX(25px)}}@keyframes slideBar2{0%{transform:translateX(0)}50%{transform:translateX(-20px)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes radarSweep{0%{stroke-dashoffset:600}}.ambient-glow{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.bar-anim-1{animation:slideBar1 8s ease-in-out infinite}.bar-anim-2{animation:slideBar2 7s ease-in-out infinite}.pill-float-1{animation:floatPill 4s ease-in-out infinite}.pill-float-2{animation:floatPill 5s ease-in-out infinite 1s}.connector-line{stroke-dasharray:8 6;animation:radarSweep 20s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="200" cy="180" r="140" fill="#6366f1" class="ambient-glow" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy="140" r="160" fill="#ec4899" class="ambient-glow" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="280" r="120" fill="#06b6d4" class="ambient-glow" filter="url(#glow)" opacity=".1"/><g opacity=".45"><line x1="80" x2="1120" y1="90" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/><line x1="80" x2="1120" y1="270" y2="270" stroke="rgba(255,255,255,0.08)" stroke-width="2"/><path fill="none" stroke="url(#lane1Grad)" stroke-width="2" d="M 180 90 Q 250 140 320 90 T 460 90" class="connector-line"/><path fill="none" stroke="url(#lane2Grad)" stroke-width="2" d="M 750 270 Q 840 220 930 270 T 1060 270" class="connector-line"/><g class="bar-anim-1"><rect width="160" height="32" x="120" y="74" fill="url(#lane1Grad)" opacity=".8" rx="16"/><circle cx="136" cy="90" r="6" fill="#fff"/><text x="152" y="95" fill="#fff" font-size="12" font-weight="600" letter-spacing=".5">NOW • DISCOVERY</text></g><g class="bar-anim-2"><rect width="170" height="32" x="880" y="74" fill="url(#lane2Grad)" opacity=".8" rx="16"/><circle cx="896" cy="90" r="6" fill="#fff"/><text x="912" y="95" fill="#fff" font-size="12" font-weight="600" letter-spacing=".5">NEXT • STRATEGY</text></g><g class="bar-anim-2"><rect width="180" height="32" x="140" y="254" fill="url(#lane3Grad)" opacity=".8" rx="16"/><circle cx="156" cy="270" r="6" fill="#fff"/><text x="172" y="275" fill="#fff" font-size="12" font-weight="600" letter-spacing=".5">LATER • MILESTONES</text></g><g class="bar-anim-1"><rect width="180" height="32" x="8